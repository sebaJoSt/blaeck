name: Source Checks

on:
  push:
    paths: ["src/**", "examples/**", "extras/scripts/checkpackage.py", "extras/scripts/syncnetwork.py", "library.*", ".github/workflows/source-checks.yml", "!**/*.md"]
  pull_request:
    paths: ["src/**", "examples/**", "extras/scripts/checkpackage.py", "extras/scripts/syncnetwork.py", "library.*", ".github/workflows/source-checks.yml", "!**/*.md"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Check manifests, examples and NetworkSetup copies
        run: python extras/scripts/checkpackage.py
